<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer Album - Administration</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/admin.css') }}" rel="stylesheet">
</head>
<body>
    <div class="admin-layout">
        <nav class="admin-sidebar">
            <div class="admin-logo">
                <h2><i class="fas fa-camera"></i> PRiMA ADMIN</h2>
            </div>
            <ul class="admin-menu">
                <li><a href="{{ url_for('admin_dashboard') }}"><i class="fas fa-tachometer-alt"></i> Tableau de bord</a></li>
                <li><a href="{{ url_for('admin_gallery') }}" class="active"><i class="fas fa-images"></i> Galerie</a></li>
                <li><a href="{{ url_for('admin_services') }}"><i class="fas fa-cogs"></i> Services</a></li>
                <li><a href="{{ url_for('admin_pages') }}"><i class="fas fa-file-alt"></i> Pages</a></li>
                <li><a href="{{ url_for('home') }}" target="_blank"><i class="fas fa-eye"></i> Voir le site</a></li>
                <li><a href="{{ url_for('admin_logout') }}"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
            </ul>
        </nav>

        <main class="admin-content">
            <header class="admin-header">
                <h1>Créer un album</h1>
                <a href="{{ url_for('admin_albums') }}" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i> Retour aux albums
                </a>
            </header>

            <div class="form-container">
                <form method="POST" class="admin-form">
                    <div class="form-group">
                        <label for="album_name">Nom de l'album *</label>
                        <input type="text" id="album_name" name="album_name" required placeholder="ex: Mariage Sarah & Thomas">
                    </div>

                    <div class="form-group">
                        <label for="album_description">Description</label>
                        <textarea id="album_description" name="album_description" rows="3" placeholder="Description de l'album..."></textarea>
                    </div>

                    <div class="album-info" style="padding: 1rem; background: #f8f9fa; border-radius: 8px; margin: 1rem 0;">
                        <i class="fas fa-info-circle" style="color: #3498db;"></i>
                        <strong>Limite d'album</strong>
                        <p style="margin: 0.5rem 0 0 0; font-size: 0.9rem; color: #666;">
                            Chaque album peut contenir un maximum de 15 photos. Vous pourrez ajouter des photos après la création de l'album.
                        </p>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-save"></i> Créer l'album
                        </button>
                        <a href="{{ url_for('admin_albums') }}" class="btn-cancel">Annuler</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
